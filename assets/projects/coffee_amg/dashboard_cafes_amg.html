<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Cafeterías AMG — @urbanistalepe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Navbar Header */
        header {
            background-color: #1E293B;
            color: #FFFFFF;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            z-index: 100;
            flex-shrink: 0;
            height: 52px;
        }

        header h1 {
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #F8FAFC;
            letter-spacing: 0.3px;
        }

        header .badge {
            background-color: #D90429;
            color: white;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        header .author {
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 5px 14px;
            border-radius: 20px;
            color: #38BDF8;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid rgba(56, 189, 248, 0.3);
            transition: all 0.2s ease;
        }

        header .author:hover {
            background: rgba(56, 189, 248, 0.2);
            color: #7DD3FC;
        }

        /* Responsive Split Layout Container */
        .dashboard-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: calc(100vh - 52px);
            width: 100%;
            overflow: hidden;
            background-color: #0F172A;
        }

        .pane {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #FFFFFF;
            transition: all 0.3s ease;
        }
        .view-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-toggle {
            background: #334155;
            border: 1px solid #475569;
            color: #F8FAFC;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-toggle:hover, .btn-toggle.active {
            background: #0EA5E9;
            border-color: #0284C7;
            color: white;
        }

        .pane {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #FFFFFF;
            transition: all 0.3s ease;
        }

        .pane:first-child {
            border-right: 2px solid #334155;
        }

        .pane iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        @media (max-width: 768px) {
            header {
                height: auto;
                flex-direction: column;
                padding: 10px 14px;
                gap: 8px;
                align-items: stretch;
            }

            header h1 {
                font-size: 0.95rem;
                justify-content: center;
                flex-wrap: wrap;
                text-align: center;
            }

            .view-controls {
                width: 100%;
                display: flex;
            }

            .btn-toggle {
                flex: 1;
                padding: 8px 4px;
                font-size: 0.78rem;
                text-align: center;
                min-height: 40px;
            }

            header .author {
                display: none;
            }

            .dashboard-container {
                display: flex;
                flex-direction: column;
                height: calc(100vh - 100px);
            }

            .pane:first-child {
                border-right: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            ☕ Cafeterías del AMG
            <span class="badge">AMG 2026</span>
        </h1>
        <div class="view-controls">
            <button class="btn-toggle active" id="btn-split" onclick="setView('split')">Dividido</button>
            <button class="btn-toggle" id="btn-map" onclick="setView('map')">🗺️ Mapa</button>
            <button class="btn-toggle" id="btn-matrix" onclick="setView('matrix')">📊 Matriz</button>
        </div>
        <a href="https://instagram.com/urbanistalepe" target="_blank" class="author">
            @urbanistalepe
        </a>
    </header>

    <div class="dashboard-container" id="main-container">
        <!-- Panel Izquierdo: Mapa Interactivo de Folium -->
        <div class="pane" id="panel-map">
            <iframe src="mapa_cafeterias_amg.html" title="Mapa Web Interactivo AMG"></iframe>
        </div>

        <!-- Panel Derecho: Matriz de Reputación de Plotly -->
        <div class="pane" id="panel-matrix">
            <iframe src="matriz_interactiva_amg.html" title="Matriz de Reputación Digital"></iframe>
        </div>
    </div>

    <script>
        function setView(mode) {
            const pMap = document.getElementById('panel-map');
            const pMatrix = document.getElementById('panel-matrix');
            const btns = document.querySelectorAll('.btn-toggle');
            btns.forEach(b => b.classList.remove('active'));
            const isMobile = window.innerWidth <= 768;

            if (mode === 'split') {
                if (isMobile) {
                    pMap.style.width = '100%';
                    pMap.style.height = '50%';
                    pMap.style.display = 'block';
                    pMatrix.style.width = '100%';
                    pMatrix.style.height = '50%';
                    pMatrix.style.display = 'block';
                } else {
                    pMap.style.width = '100%';
                    pMap.style.height = '100%';
                    pMap.style.display = 'block';
                    pMatrix.style.width = '100%';
                    pMatrix.style.height = '100%';
                    pMatrix.style.display = 'block';
                    document.getElementById('main-container').style.display = 'grid';
                }
                document.getElementById('btn-split').classList.add('active');
            } else if (mode === 'map') {
                pMap.style.width = '100%';
                pMap.style.height = '100%';
                pMap.style.display = 'block';
                pMatrix.style.display = 'none';
                if (!isMobile) document.getElementById('main-container').style.display = 'block';
                document.getElementById('btn-map').classList.add('active');
            } else if (mode === 'matrix') {
                pMap.style.display = 'none';
                pMatrix.style.width = '100%';
                pMatrix.style.height = '100%';
                pMatrix.style.display = 'block';
                if (!isMobile) document.getElementById('main-container').style.display = 'block';
                document.getElementById('btn-matrix').classList.add('active');
            }
        }

        if (window.innerWidth <= 768) {
            setView('map');
        }
    </script>
</body>
</html>
